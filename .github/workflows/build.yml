name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release and upload EXE'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # Pillow is likely in requirements.txt, but we explicitly need it for the next step.
        pip install Pillow 

    - name: Generate Icon
      shell: python
      run: |
        from PIL import Image, ImageDraw
        import os

        def create_icon_image(size):
            # Create a scaled version of the Ephemeral logo
            image = Image.new('RGB', (size, size), (30, 30, 30))
            dc = ImageDraw.Draw(image)
            scale = size / 64
            
            # White generic document
            dc.rectangle((16 * scale, 16 * scale, 48 * scale, 48 * scale), fill=(255, 255, 255))
            # Blue header bar
            dc.rectangle((20 * scale, 20 * scale, 44 * scale, 28 * scale), fill=(0, 120, 215))
            return image

        # Generate multiple sizes for a proper Windows .ico
        sizes = [16, 32, 48, 64, 128, 256]
        images = [create_icon_image(s) for s in sizes]

        # Save the file to the current working directory
        images[0].save('ephemeral.ico', format='ICO', sizes=[(img.width, img.height) for img in images])
        print("Icon generated successfully: ephemeral.ico")

    - name: Inject Version Number
      shell: python
      run: |
        import os
        with open('ephemeral.py', 'r', encoding='utf-8') as f:
            content = f.read()
        
        full_sha = "${{ github.sha }}"
        short_sha = full_sha[:7]
        version = "Build ${{ github.run_number }} (" + short_sha + ")"
        content = content.replace('Version number (injected from the github workflow)', version)
        
        with open('ephemeral.py', 'w', encoding='utf-8') as f:
            f.write(content)
        print(f"Injected version: {version}")

    - name: Build EXE with PyInstaller
      run: |
        # Added --icon flag to the build command
        pyinstaller --noconsole --onefile --name "Ephemeral" --icon="ephemeral.ico" ephemeral.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Windows-EXE
        path: dist/Ephemeral.exe

    - name: Generate Timestamp Tag
      if: github.event.inputs.create_release == 'true'
      id: time
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')-$SHORT_SHA" >> $GITHUB_ENV

    - name: Create Release and Upload EXE
      if: github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.TIMESTAMP }}
        name: Release v${{ env.TIMESTAMP }}
        files: dist/Ephemeral.exe
        generate_release_notes: true
