name: Build & Release

on:
  push:
    branches: [ "main" ]
    # The scheduled swarm-bootstrap bot only touches docs/swarm.json —
    # don't run the whole pipeline (and artifacts) for that.
    paths-ignore: [ "docs/swarm.json" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Tests ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r requirements-api.txt

    - name: Install networking tier deps
      run: pip install -r requirements-net.txt

    - name: Run core tests
      run: python test_core.py

    - name: Run disk-space guardrail tests
      run: python test_space.py

    - name: Run API model tests
      run: python test_api.py

    - name: Run networking tier tests
      run: python test_net.py

    - name: Run self-host distributed gateway tests
      run: python test_self_host.py

    - name: Run bastion server tests
      run: python test_bastion.py

  # ── Windows EXE: local ────────────────────────────────────────
  build-exe:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt pyinstaller
        pip install -r requirements-api.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" main_local.py

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name Ephemeral --icon=ephemeral.ico --hidden-import=ephemeral_core main_local.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Windows-EXE
        path: dist/Ephemeral.exe

  # ── Windows EXE: distributed ──────────────────────────────────
  build-exe-distributed:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt pyinstaller
        pip install -r requirements-api.txt
        pip install -r requirements-net.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" main_distributed_client.py

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name Ephemeral-Distributed --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --collect-all iroh main_distributed_client.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Distributed-Windows-EXE
        path: dist/Ephemeral-Distributed.exe

  # ── Linux AppImages: local + distributed ──────────────────────
  build-linux-appimage:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build local AppImage
      shell: bash
      run: |
        VERSION="$(date +'%Y%m%d')-${GITHUB_SHA::7}" bash packaging/build_appimage.sh local

    - name: Build distributed AppImage
      shell: bash
      run: |
        VERSION="$(date +'%Y%m%d')-${GITHUB_SHA::7}" bash packaging/build_appimage.sh distributed

    - name: Smoke test — local AppImage self-check
      shell: bash
      run: |
        chmod +x dist/ephemeral-local-x86_64.AppImage
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ephemeral-local-x86_64.AppImage --self-check

    - name: Smoke test — distributed AppImage self-check
      shell: bash
      run: |
        chmod +x dist/ephemeral-distributed-x86_64.AppImage
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ephemeral-distributed-x86_64.AppImage --self-check

    # Release consistency: a release's wasm tarball must match the exact
    # released source, not whatever glue was last committed (wasm-build.yml
    # commits glue to main on a separate bot commit, so the committed web/wbg
    # can lag the source). On release runs, compile the wasm here and let the
    # packaging step below tar the freshly generated glue. Ordinary pushes
    # keep packaging the committed glue — no duplicate compile per commit.
    - name: Set up Rust (wasm target, release only)
      if: github.event.inputs.create_release == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Build wasm module (release only)
      if: github.event.inputs.create_release == 'true'
      shell: bash
      working-directory: ephemeral-wasm-library
      env:
        CC_wasm32_unknown_unknown: clang
        AR_wasm32_unknown_unknown: llvm-ar
      run: |
        # The runner ships clang but not llvm-ar; ring's build needs the LLVM
        # archiver to produce the wasm static lib from clang's objects.
        sudo apt-get update
        sudo apt-get install -y llvm
        command -v clang
        command -v llvm-ar
        curl -fsSL \
          https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz \
          | tar xz
        export PATH="$(pwd)/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl:$PATH"
        cargo build --release --target wasm32-unknown-unknown
        wasm-bindgen --target web --out-dir web/wbg \
          target/wasm32-unknown-unknown/release/ephemeral_wasm_library.wasm

    - name: Package wasm/SPA bundle
      shell: bash
      run: |
        cd ephemeral-wasm-library
        tar czf ../dist/ephemeral-wasm-library.tar.gz web/ src/ Cargo.toml build.sh README.md .cargo/
        cd ..

    - name: Package self-host distributed tier
      shell: bash
      run: |
        # main_distributed.py imports main_api (wire contract), which pulls in
        # ephemeral_core; the gateway pulls in ephemeral_net. All four are required.
        tar czf dist/ephemeral-self-host-distributed.tar.gz \
          ephemeral_self_host/ ephemeral_net/ main_distributed.py main_api.py \
          ephemeral_core/ requirements-net.txt requirements-api.txt \
          Dockerfile .dockerignore

    - name: Package self-host (non-distributed) tier
      shell: bash
      run: |
        tar czf dist/ephemeral-self-host.tar.gz \
          main_api.py ephemeral_core/ \
          requirements-api.txt Dockerfile.api .dockerignore

    - name: Smoke test — install script + release tarballs
      shell: bash
      run: |
        set -euo pipefail
        # EPHEMERAL_FROM_MAIN=1 makes the installer test deterministic against
        # the current branch (the released tarball is only rebuilt on release).
        export INSTALL_DIR="$HOME/.ephemeral-smoke-local"
        curl -fsSL https://raw.githubusercontent.com/Xyvir/Ephemeral.exe/main/install_self_host.sh | EPHEMERAL_FROM_MAIN=1 EPHEMERAL_PREHYDRATE=0 bash -s -- local
        (cd "$INSTALL_DIR" && .venv/bin/python -c "from main_api import app; print('local API imports OK')")
        export INSTALL_DIR="$HOME/.ephemeral-smoke-dist"
        curl -fsSL https://raw.githubusercontent.com/Xyvir/Ephemeral.exe/main/install_self_host.sh | EPHEMERAL_FROM_MAIN=1 EPHEMERAL_PREHYDRATE=0 bash -s -- distributed
        (cd "$INSTALL_DIR" && .venv/bin/python -c "from main_distributed import app; print('distributed gateway imports OK')")
        # Verify the tarballs that releases/installer users actually receive are
        # complete (main_distributed imports main_api -> ephemeral_core, and the
        # gateway pulls in ephemeral_net).
        PY="$INSTALL_DIR/.venv/bin/python"
        for asset in ephemeral-self-host ephemeral-self-host-distributed; do
          rm -rf "$HOME/.tarball-check" && mkdir -p "$HOME/.tarball-check"
          tar -xzf "dist/$asset.tar.gz" -C "$HOME/.tarball-check"
          (cd "$HOME/.tarball-check" && "$PY" -c "import main_api")
        done
        (cd "$HOME/.tarball-check" && "$PY" -c "import main_distributed; print('both tarballs import OK')")

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Linux-AppImages
        path: |
          dist/ephemeral-local-x86_64.AppImage
          dist/ephemeral-distributed-x86_64.AppImage
          dist/ephemeral-wasm-library.tar.gz
          dist/ephemeral-self-host-distributed.tar.gz
          dist/ephemeral-self-host.tar.gz

  # ── Release ───────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-exe, build-exe-distributed, build-linux-appimage]
    if: github.event.inputs.create_release == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: Generate tag
      id: tag
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        echo "TAG=v$(date +'%Y%m%d-%H%M%S')-${SHORT_SHA}" >> $GITHUB_ENV

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: Release ${{ env.TAG }}
        files: |
          dist/Ephemeral.exe
          dist/Ephemeral-Distributed.exe
          dist/ephemeral-local-x86_64.AppImage
          dist/ephemeral-distributed-x86_64.AppImage
          dist/ephemeral-wasm-library.tar.gz
          dist/ephemeral-self-host-distributed.tar.gz
          dist/ephemeral-self-host.tar.gz
        generate_release_notes: true
