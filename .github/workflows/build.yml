name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release and upload EXE'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Prepare Build Script
      run: |
        sed -i "s/main.zip/${{ github.sha }}.zip/g" build.md
        sed -i "s/Ephemeral.exe-main/Ephemeral.exe-${{ github.sha }}/g" build.md

    - name: Build EXE via Ephemeral
      run: python ephemeral.py --cli build.md

    - name: Rename Artifact
      run: |
        mkdir dist
        # Ephemeral names the downloaded file Ephemeral_pywine_Ephemeral.exe due to prefixing
        mv Ephemeral_pywine_Ephemeral.exe dist/Ephemeral.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Windows-EXE
        path: dist/Ephemeral.exe

    - name: Generate Timestamp Tag
      if: github.event.inputs.create_release == 'true'
      id: time
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')-$SHORT_SHA" >> $GITHUB_ENV

    - name: Create Release and Upload EXE
      if: github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.TIMESTAMP }}
        name: Release v${{ env.TIMESTAMP }}
        files: dist/Ephemeral.exe
        generate_release_notes: true
