name: Build & Release

on:
  push:
    branches: [ "main" ]
    # The scheduled swarm-bootstrap bot only touches docs/swarm.json —
    # don't run the whole pipeline (and artifacts) for that.
    paths-ignore: [ "docs/swarm.json" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Tests ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r requirements-api.txt

    - name: Install networking tier deps
      run: pip install -r requirements-net.txt

    - name: Install trusted MCP deps
      run: pip install -r requirements-mcp.txt

    - name: Run core tests
      run: python test_core.py

    - name: Run disk-space guardrail tests
      run: python test_space.py

    - name: Run API model tests
      run: python test_api.py

    - name: Run networking tier tests
      run: python test_net.py

    - name: Run self-host distributed gateway tests
      run: python test_self_host.py

    - name: Run bastion server tests
      run: python test_bastion.py

    - name: Run trusted MCP tests
      run: python test_mcp.py

    - name: Run tray / always-on-node tests
      run: python test_ui.py

  # ── Windows EXE: local ────────────────────────────────────────
  build-exe:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install -c constraints-clean-build.txt -r requirements.txt pyinstaller
        python -m pip install -c constraints-clean-build.txt -r requirements-api.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" ephemeral_ui/backends/local.py

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name Ephemeral --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --hidden-import=ephemeral_ui.backends.distributed --collect-all iroh main_local.py

    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'pyinstaller --noconsole --onefile --name Ephemeral --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --hidden-import=ephemeral_ui.backends.distributed --collect-all iroh main_local.py' \
          --artifact dist/Ephemeral.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Windows-EXE
        path: |
          dist/Ephemeral.exe
          dist/Ephemeral-build-manifest.json

  # ── Windows EXE: distributed ──────────────────────────────────
  build-exe-distributed:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install -c constraints-clean-build.txt -r requirements.txt pyinstaller
        python -m pip install -c constraints-clean-build.txt -r requirements-api.txt
        python -m pip install -c constraints-clean-build.txt -r requirements-net.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" ephemeral_ui/backends/distributed.py

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name Ephemeral-Distributed --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --collect-all iroh main_distributed_client.py

    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-Distributed-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'pyinstaller --noconsole --onefile --name Ephemeral-Distributed --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --collect-all iroh main_distributed_client.py' \
          --artifact dist/Ephemeral-Distributed.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Distributed-Windows-EXE
        path: |
          dist/Ephemeral-Distributed.exe
          dist/Ephemeral-Distributed-build-manifest.json

  # ── Windows onedir bundle: distributed (beta) ─────────────────
  # The stable Windows builds are --onefile self-extractors. This job ships the
  # distributed app as a onedir folder with UPX disabled and a Win32 version
  # resource, so the antivirus-sensitive path (an always-on classroom node on a
  # professor's PC) has a bundle to test that does not carry the two packaging
  # traits heuristics flag most often. The stable artifacts are unchanged.
  build-exe-distributed-beta:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install -c constraints-clean-build.txt -r requirements.txt pyinstaller
        python -m pip install -c constraints-clean-build.txt -r requirements-api.txt
        python -m pip install -c constraints-clean-build.txt -r requirements-net.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" ephemeral_ui/backends/distributed.py
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" packaging/version_info.txt
        # Keep the fixed-version tuples numerically truthful too (build date).
        YMD="$(date +'%Y%m%d')"
        NUM="($((10#${YMD:0:4})), $((10#${YMD:4:2})), $((10#${YMD:6:2})), 0)"
        sed -i "s/(0, 0, 0, 0)/${NUM}/g" packaging/version_info.txt
        grep -n 'FileVersion\|filevers' packaging/version_info.txt

    - name: Build onedir bundle
      run: pyinstaller --noconfirm packaging/ephemeral-distributed-beta.spec

    - name: Smoke test — bundled self-check
      shell: bash
      run: |
        # Same check the AppImage builds run: start a node, print its id, exit.
        ./dist/Ephemeral-Distributed-Beta/Ephemeral-Distributed-Beta.exe --self-check
        echo "beta self-check passed"

    - name: Package bundle (zip)
      shell: bash
      run: |
        python - <<'PY'
        import os, zipfile
        src = "dist/Ephemeral-Distributed-Beta"
        out = "dist/Ephemeral-Distributed-Beta-win64.zip"
        base = os.path.dirname(src)
        if not os.path.isfile(os.path.join(src, "Ephemeral-Distributed-Beta.exe")):
            raise SystemExit(f"missing built exe in {src}")
        with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
            for root, _dirs, files in os.walk(src):
                for name in sorted(files):
                    path = os.path.join(root, name)
                    zf.write(path, os.path.relpath(path, base))
        print("wrote", out, os.path.getsize(out), "bytes")
        PY

    - name: Build machine-wide MSI
      shell: bash
      run: |
        # Windows Installer version fields are numeric and range-limited, so the
        # date+SHA version the other artifacts carry cannot be used: pass a
        # date-derived x.y.z (YY.M.D) that increases for the life of this
        # installer. WiX v3 ships on the runner; build_msi.sh finds it.
        VERSION="$(date +'%y.%-m.%-d')"
        echo "MSI product version: $VERSION"
        MSYS2_ARG_CONV_EXCL='*' bash packaging/msi/build_msi.sh \
          dist/Ephemeral-Distributed-Beta \
          dist/Ephemeral-Distributed-Beta.msi "$VERSION"

    - name: Smoke test - install and remove the MSI
      shell: bash
      run: |
        # A machine-wide install writes %ProgramFiles% and the HKLM Run key, so
        # it needs elevation - the runner has it, and /qn keeps it unattended.
        # MSYS2_ARG_CONV_EXCL stops Git Bash turning /i into a path.
        export MSYS2_ARG_CONV_EXCL='*'
        msiexec /i dist/Ephemeral-Distributed-Beta.msi /qn /l*v msi-install.log
        ls -la "$PROGRAMFILES/Ephemeral-Distributed-Beta/Ephemeral-Distributed-Beta.exe"
        msiexec /x dist/Ephemeral-Distributed-Beta.msi /qn /l*v msi-uninstall.log
        test ! -d "$PROGRAMFILES/Ephemeral-Distributed-Beta"
        echo "MSI install + uninstall smoke passed"

    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-Distributed-Beta-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'pyinstaller --noconfirm packaging/ephemeral-distributed-beta.spec' \
          --artifact dist/Ephemeral-Distributed-Beta-win64.zip \
          --artifact dist/Ephemeral-Distributed-Beta.msi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Distributed-Beta-Windows-onedir
        path: |
          dist/Ephemeral-Distributed-Beta-win64.zip
          dist/Ephemeral-Distributed-Beta.msi
          dist/Ephemeral-Distributed-Beta-build-manifest.json

  # ── Linux AppImages: local + distributed ──────────────────────
  build-linux-appimage:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build local AppImage
      shell: bash
      run: |
        VERSION="$(date +'%Y%m%d')-${GITHUB_SHA::7}" bash packaging/build_appimage.sh local

    - name: Build distributed AppImage
      shell: bash
      run: |
        VERSION="$(date +'%Y%m%d')-${GITHUB_SHA::7}" bash packaging/build_appimage.sh distributed

    - name: Smoke test — local AppImage self-check
      shell: bash
      run: |
        chmod +x dist/ephemeral-local-x86_64.AppImage
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ephemeral-local-x86_64.AppImage --self-check

    - name: Smoke test — distributed AppImage self-check
      shell: bash
      run: |
        chmod +x dist/ephemeral-distributed-x86_64.AppImage
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ephemeral-distributed-x86_64.AppImage --self-check

    # Release consistency: a release's wasm tarball must match the exact
    # released source, not whatever glue was last committed (wasm-build.yml
    # commits glue to main on a separate bot commit, so the committed web/wbg
    # can lag the source). On release runs, compile the wasm here and let the
    # packaging step below tar the freshly generated glue. Ordinary pushes
    # keep packaging the committed glue — no duplicate compile per commit.
    - name: Set up Rust (wasm target, release only)
      if: github.event.inputs.create_release == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Build wasm module (release only)
      if: github.event.inputs.create_release == 'true'
      shell: bash
      working-directory: ephemeral-wasm-library
      env:
        CC_wasm32_unknown_unknown: clang
        AR_wasm32_unknown_unknown: llvm-ar
      run: |
        # The runner ships clang but not llvm-ar; ring's build needs the LLVM
        # archiver to produce the wasm static lib from clang's objects.
        sudo apt-get update
        sudo apt-get install -y llvm
        command -v clang
        command -v llvm-ar
        curl -fsSL \
          https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz \
          | tar xz
        export PATH="$(pwd)/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl:$PATH"
        cargo build --release --target wasm32-unknown-unknown
        wasm-bindgen --target web --out-dir web/wbg \
          target/wasm32-unknown-unknown/release/ephemeral_wasm_library.wasm

    - name: Package wasm/SPA bundle
      shell: bash
      run: |
        cd ephemeral-wasm-library
        tar czf ../dist/ephemeral-wasm-library.tar.gz web/ src/ Cargo.toml build.sh README.md .cargo/
        cd ..

    - name: Package self-host distributed tier
      shell: bash
      run: |
        # main_distributed.py imports the shared API wire contract, which pulls
        # in ephemeral_core; the gateway pulls in ephemeral_net. MCP source is
        # included for explicit private server builds.
        tar czf dist/ephemeral-self-host-distributed.tar.gz \
          ephemeral_self_host/ ephemeral_net/ main_distributed.py \
          ephemeral_api/ ephemeral_core/ ephemeral_mcp/ requirements-net.txt requirements-api.txt requirements-mcp.txt \
          Dockerfile .dockerignore

    - name: Package self-host (non-distributed) tier
      shell: bash
      run: |
        tar czf dist/ephemeral-self-host.tar.gz \
          main_api.py          ephemeral_api/ ephemeral_core/ ephemeral_mcp/ \
          requirements-api.txt requirements-mcp.txt Dockerfile.api .dockerignore


    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-Linux-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'packaging/build_appimage.sh local && packaging/build_appimage.sh distributed' \
          --artifact dist/ephemeral-local-x86_64.AppImage \
          --artifact dist/ephemeral-distributed-x86_64.AppImage \
          --artifact dist/ephemeral-wasm-library.tar.gz \
          --artifact dist/ephemeral-self-host-distributed.tar.gz \
          --artifact dist/ephemeral-self-host.tar.gz

    - name: Smoke test — install script + release tarballs
      shell: bash
      run: |
        set -euo pipefail
        # EPHEMERAL_FROM_MAIN=1 makes the installer test deterministic against
        # the current branch (the released tarball is only rebuilt on release).
        export INSTALL_DIR="$HOME/.ephemeral-smoke-local"
        curl -fsSL https://raw.githubusercontent.com/Xyvir/Ephemeral.exe/main/install_self_host.sh | EPHEMERAL_FROM_MAIN=1 EPHEMERAL_PREHYDRATE=0 bash -s -- local
        (cd "$INSTALL_DIR" && .venv/bin/python -c "from main_api import app; print('local API imports OK')")
        export INSTALL_DIR="$HOME/.ephemeral-smoke-dist"
        curl -fsSL https://raw.githubusercontent.com/Xyvir/Ephemeral.exe/main/install_self_host.sh | EPHEMERAL_FROM_MAIN=1 EPHEMERAL_PREHYDRATE=0 bash -s -- distributed
        (cd "$INSTALL_DIR" && .venv/bin/python -c "from main_distributed import app; print('distributed gateway imports OK')")
        # Verify the tarballs that releases/installer users actually receive are
        # complete (main_distributed imports main_api -> ephemeral_core, and the
        # gateway pulls in ephemeral_net).
        PY="$INSTALL_DIR/.venv/bin/python"
        rm -rf "$HOME/.tarball-check" && mkdir -p "$HOME/.tarball-check"
        tar -xzf "dist/ephemeral-self-host.tar.gz" -C "$HOME/.tarball-check"
        (cd "$HOME/.tarball-check" && "$PY" -c "import main_api")
        rm -rf "$HOME/.tarball-check" && mkdir -p "$HOME/.tarball-check"
        tar -xzf "dist/ephemeral-self-host-distributed.tar.gz" -C "$HOME/.tarball-check"
        (cd "$HOME/.tarball-check" && "$PY" -c "import main_distributed; print('both tarballs import OK')")

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Linux-AppImages
        path: |
          dist/ephemeral-local-x86_64.AppImage
          dist/ephemeral-distributed-x86_64.AppImage
          dist/ephemeral-wasm-library.tar.gz
          dist/ephemeral-self-host-distributed.tar.gz
          dist/ephemeral-self-host.tar.gz

  # ── ClamAV canary: best effort, never blocks ──────────────────
  # A single-engine smoke signal over the built Windows executables — the
  # artifacts antivirus actually flags. ClamAV cannot reproduce Windows
  # Defender's PyInstaller heuristics, so this job reports and always passes:
  # it exists to catch an obviously bad artifact and to leave a per-build
  # record, never to be a verdict (see scripts/scan_artifacts.sh). It is
  # deliberately NOT in the release job's `needs`, so it cannot gate a release.
  scan-artifacts:
    runs-on: ubuntu-latest
    needs: [build-exe, build-exe-distributed, build-exe-distributed-beta]

    steps:
    - uses: actions/checkout@v4

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        merge-multiple: true

    - name: Install ClamAV
      continue-on-error: true
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clamav
        # freshclam holds the database lock while its service runs; stop it,
        # then fall back to the packaged database if the update fails — a
        # stale database still beats no canary.
        sudo systemctl stop clamav-freshclam 2>/dev/null || true
        sudo freshclam || echo "::warning::ClamAV signature update failed; scanning with the packaged database"

    - name: Scan artifacts (soft gate - never blocks a release)
      continue-on-error: true
      run: bash scripts/scan_artifacts.sh artifacts

    - name: Upload ClamAV report
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ClamAV-report
        path: clamav-report.txt
        if-no-files-found: ignore

  # ── Release ───────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-exe, build-exe-distributed, build-exe-distributed-beta, build-linux-appimage]
    if: github.event.inputs.create_release == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: Generate tag
      id: tag
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        echo "TAG=v$(date +'%Y%m%d-%H%M%S')-${SHORT_SHA}" >> $GITHUB_ENV

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: Release ${{ env.TAG }}
        files: |
          dist/Ephemeral-Distributed-Beta-win64.zip
          dist/Ephemeral-Distributed-Beta.msi
          dist/Ephemeral.exe
          dist/Ephemeral-Distributed.exe
          dist/ephemeral-local-x86_64.AppImage
          dist/ephemeral-distributed-x86_64.AppImage
          dist/ephemeral-wasm-library.tar.gz
          dist/ephemeral-self-host-distributed.tar.gz
          dist/ephemeral-self-host.tar.gz
          dist/Ephemeral-build-manifest.json
          dist/Ephemeral-Distributed-build-manifest.json
          dist/Ephemeral-Distributed-Beta-build-manifest.json
          dist/Ephemeral-Linux-build-manifest.json
        generate_release_notes: true
