name: Build & Release

on:
  push:
    branches: [ "main" ]
    # The scheduled swarm-bootstrap bot only touches docs/swarm.json —
    # don't run the whole pipeline (and artifacts) for that.
    paths-ignore: [ "docs/swarm.json" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Tests ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r requirements-api.txt

    - name: Install networking tier deps
      run: pip install -r requirements-net.txt

    - name: Install trusted MCP deps
      run: pip install -r requirements-mcp.txt

    - name: Run core tests
      run: python test_core.py

    - name: Run disk-space guardrail tests
      run: python test_space.py

    - name: Run API model tests
      run: python test_api.py

    - name: Run networking tier tests
      run: python test_net.py

    - name: Run self-host distributed gateway tests
      run: python test_self_host.py

    - name: Run bastion server tests
      run: python test_bastion.py

    - name: Run trusted MCP tests
      run: python test_mcp.py

    - name: Run tray / always-on-node tests
      run: python test_ui.py

    - name: Run container-runtime prerequisite tests
      run: python test_prereq.py

  # ── Windows EXE: local ────────────────────────────────────────
  build-exe:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install -c constraints-clean-build.txt -r requirements.txt pyinstaller
        python -m pip install -c constraints-clean-build.txt -r requirements-api.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" ephemeral_ui/backends/local.py

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name Ephemeral --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --hidden-import=ephemeral_ui.backends.distributed --collect-all iroh main_local.py

    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'pyinstaller --noconsole --onefile --name Ephemeral --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --hidden-import=ephemeral_ui.backends.distributed --collect-all iroh main_local.py' \
          --artifact dist/Ephemeral.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Windows-EXE
        path: |
          dist/Ephemeral.exe
          dist/Ephemeral-build-manifest.json

  # ── Windows EXE: distributed ──────────────────────────────────
  build-exe-distributed:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install -c constraints-clean-build.txt -r requirements.txt pyinstaller
        python -m pip install -c constraints-clean-build.txt -r requirements-api.txt
        python -m pip install -c constraints-clean-build.txt -r requirements-net.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" ephemeral_ui/backends/distributed.py

    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name Ephemeral-Distributed --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --collect-all iroh main_distributed_client.py

    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-Distributed-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'pyinstaller --noconsole --onefile --name Ephemeral-Distributed --icon=ephemeral.ico --hidden-import=ephemeral_core --hidden-import=ephemeral_net --collect-all iroh main_distributed_client.py' \
          --artifact dist/Ephemeral-Distributed.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Distributed-Windows-EXE
        path: |
          dist/Ephemeral-Distributed.exe
          dist/Ephemeral-Distributed-build-manifest.json

  # ── Windows onedir bundle: distributed (Instructor) ─────────────────
  # The stable Windows builds are --onefile self-extractors. This job ships the
  # distributed app as a onedir folder with UPX disabled and a Win32 version
  # resource, so the antivirus-sensitive path (an always-on classroom node on a
  # professor's PC) has a bundle to test that does not carry the two packaging
  # traits heuristics flag most often. The stable artifacts are unchanged.
  build-exe-distributed-instructor:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install dependencies
      run: |
        python -m pip install -c constraints-clean-build.txt -r requirements.txt pyinstaller
        python -m pip install -c constraints-clean-build.txt -r requirements-api.txt
        python -m pip install -c constraints-clean-build.txt -r requirements-net.txt

    - name: Generate icon
      run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (64, 64), (30, 30, 30)); dc=ImageDraw.Draw(img); dc.rectangle((16, 16, 48, 48), fill=(255, 255, 255)); dc.rectangle((20, 20, 44, 28), fill=(0, 120, 215)); img.save('ephemeral.ico')"

    - name: Inject version
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" ephemeral_ui/backends/distributed.py
        sed -i "s/Version number (injected from the github workflow)/${VERSION}/g" packaging/version_info.txt
        # Keep the fixed-version tuples numerically truthful too (build date).
        YMD="$(date +'%Y%m%d')"
        NUM="($((10#${YMD:0:4})), $((10#${YMD:4:2})), $((10#${YMD:6:2})), 0)"
        sed -i "s/(0, 0, 0, 0)/${NUM}/g" packaging/version_info.txt
        grep -n 'FileVersion\|filevers' packaging/version_info.txt

    - name: Build onedir bundle
      run: pyinstaller --noconfirm packaging/ephemeral-distributed-instructor.spec

    - name: Smoke test — bundled self-check
      shell: bash
      run: |
        # Same check the AppImage builds run: start a node, print its id, exit.
        ./dist/Ephemeral-Distributed-Instructor/Ephemeral-Distributed-Instructor.exe --self-check
        echo "instructor self-check passed"

    - name: Package bundle (zip)
      shell: bash
      run: |
        python - <<'PY'
        import os, zipfile
        src = "dist/Ephemeral-Distributed-Instructor"
        out = "dist/Ephemeral-Distributed-Instructor-win64.zip"
        base = os.path.dirname(src)
        if not os.path.isfile(os.path.join(src, "Ephemeral-Distributed-Instructor.exe")):
            raise SystemExit(f"missing built exe in {src}")
        with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
            for root, _dirs, files in os.walk(src):
                for name in sorted(files):
                    path = os.path.join(root, name)
                    zf.write(path, os.path.relpath(path, base))
        print("wrote", out, os.path.getsize(out), "bytes")
        PY

    - name: Build machine-wide MSI
      shell: bash
      run: |
        # Windows Installer version fields are numeric and range-limited, so the
        # date+SHA version the other artifacts carry cannot be used: pass a
        # date-derived x.y.z (YY.M.D) that increases for the life of this
        # installer. WiX v3 ships on the runner; build_msi.sh finds it.
        VERSION="$(date +'%y.%-m.%-d')"
        echo "MSI product version: $VERSION"
        MSYS2_ARG_CONV_EXCL='*' bash packaging/msi/build_msi.sh \
          dist/Ephemeral-Distributed-Instructor \
          dist/Ephemeral-Distributed-Instructor.msi "$VERSION"

    - name: Smoke test - install and remove the MSI
      shell: bash
      run: |
        # msiexec is a native Windows binary and has to be handed a Windows
        # path. Given the POSIX-relative `dist/...msi` it answered 1619, "This
        # installation package could not be opened" - the MSI-in-a-subfolder
        # case, where the reference is in a form the installer does not
        # resolve. cygpath -w gives the absolute backslash form, and
        # MSYS2_ARG_CONV_EXCL stops Git Bash rewriting /i and /qn.
        # A machine-wide install writes %ProgramFiles% and the HKLM Run key, so
        # it needs elevation - the runner has it, and /qn keeps it unattended.
        export MSYS2_ARG_CONV_EXCL='*'
        PKG="$PWD/dist/Ephemeral-Distributed-Instructor.msi"
        if [ ! -f "$PKG" ]; then
          echo "no MSI at $PKG - the build step produced nothing" >&2
          ls -la dist >&2
          exit 1
        fi
        # A Windows Installer package is an OLE compound file, and msiexec
        # answers a non-package with the same 1619 as a path it cannot reach,
        # so check the magic and name a bad artifact as one.
        magic="$(head -c 8 "$PKG" | od -An -tx1 | tr -d ' \n')"
        if [ "$magic" != "d0cf11e0a1b11ae1" ]; then
          echo "$PKG is not an MSI (OLE magic: $magic)" >&2
          exit 1
        fi
        MSI="$(cygpath -w "$PKG")"
        RUNKEY='HKLM\Software\Microsoft\Windows\CurrentVersion\Run'
        INSTALLED="$(cygpath -u "${PROGRAMFILES:-C:\Program Files}")/Ephemeral-Distributed-Instructor"
        echo "installing $MSI ($(du -h "$PKG" | cut -f1))"
        # Git Bash reports a Windows exit status mod 256, so msiexec's 1619
        # reaches the log as "exit code 83" with nothing saying why: on failure
        # print the status we did see, and the installer's own log.
        code=0
        msiexec /i "$MSI" /qn /l*v "$(cygpath -w "$PWD/msi-install.log")" || code=$?
        if [ "$code" -ne 0 ]; then
          echo "msiexec /i failed: status $code (bash reports it mod 256, so 1619 shows as 83)" >&2
          tail -n 40 msi-install.log >&2 || true
          exit 1
        fi
        ls -la "$INSTALLED/Ephemeral-Distributed-Instructor.exe"
        # "Machine-wide" is the claim this package makes, so the smoke test
        # checks the machine-wide entries rather than only the files.
        echo "--- machine-wide Run entry ---"
        reg query "$RUNKEY" /v Ephemeral-Distributed-Instructor /reg:64
        reg query "$RUNKEY" /v Ephemeral-Distributed-Instructor /reg:64 | grep -qF -- 'Ephemeral-Distributed-Instructor.exe' || {
          echo "the machine-wide start-on-boot entry is missing from $RUNKEY" >&2
          exit 1
        }
        reg query 'HKLM\Software\Ephemeral\Ephemeral-Distributed-Instructor' /v NodeAtLogin /reg:64
        code=0
        msiexec /x "$MSI" /qn /l*v "$(cygpath -w "$PWD/msi-uninstall.log")" || code=$?
        if [ "$code" -ne 0 ]; then
          echo "msiexec /x failed: status $code" >&2
          tail -n 40 msi-uninstall.log >&2 || true
          exit 1
        fi
        if [ -d "$INSTALLED" ]; then
          echo "the install directory survived uninstall: $INSTALLED" >&2
          exit 1
        fi
        if reg query "$RUNKEY" /v Ephemeral-Distributed-Instructor /reg:64 >/dev/null 2>&1; then
          echo "the machine-wide start-on-boot entry survived uninstall" >&2
          exit 1
        fi
        echo "MSI install + uninstall smoke passed, machine-wide entries included"

    # ── Setup bundle: WSL2 + Podman + the MSI in one download ────────────────
    # The MSI alone cannot enable WSL2 (elevation + a reboot), so teachers get a
    # Burn bundle. Podman's installer is pinned by version and embedded, so
    # setup never depends on a teacher's network — and a rename upstream fails
    # this job loudly instead of shipping a bundle missing its runtime.
    # The runner's preinstalled WiX v3 has candle/light/heat but not burn.exe
    # (the binaries-only layout), and a bundle needs the full toolset. Install
    # the full package pinned, then export its bin directory to later steps.
    - name: Install the full WiX v3 toolset (burn.exe)
      shell: pwsh
      run: |
        # --force: the runner reports this version as already installed, which can
        # be a partial install without the extensions. Reinstall to get the full one.
        choco install wixtoolset --version=3.14.1.20250415 -y --force --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install wixtoolset failed ($LASTEXITCODE)" }
        $burn = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Recurse -Filter burn.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $burn) { throw 'burn.exe still missing after installing WiX' }
        $bin = $burn.DirectoryName.Replace('\', '/') -replace '^([A-Za-z]):', '/$1'
        $balDll = Join-Path $burn.DirectoryName 'WixBalExtension.dll'
        if (-not (Test-Path $balDll)) {
          # Some layouts keep extensions in a sibling folder; copy the DLL beside burn.exe.
          $found = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*", "${env:ProgramFiles}\WiX Toolset*" -Recurse -Filter WixBalExtension.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Copy-Item $found.FullName $balDll } else {
            Get-ChildItem $burn.DirectoryName | ForEach-Object { Write-Host $_.Name }
            throw 'WixBalExtension.dll is not in this WiX install (see listing above)'
          }
        }
        echo "WIX_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "WiX bin: $bin"

    - name: Download the pinned Podman installer
      shell: bash
      run: |
        PODMAN_VERSION="6.1.4"
        URL="https://github.com/podman-container-tools/podman/releases/download/v${PODMAN_VERSION}/podman-installer-windows-amd64.msi"
        echo "downloading $URL"
        curl -fsSL --retry 3 -o dist/podman-installer-windows-amd64.msi "$URL"
        # An HTML error page is the usual result of a moved release; name it.
        magic="$(head -c 8 dist/podman-installer-windows-amd64.msi | od -An -tx1 | tr -d ' \n')"
        if [ "$magic" != "d0cf11e0a1b11ae1" ]; then
          echo "the Podman download is not an MSI (magic: $magic)" >&2
          exit 1
        fi
        ls -lh dist/podman-installer-windows-amd64.msi

    - name: Build the setup bundle
      shell: bash
      run: |
        VERSION="$(date +'%y.%-m.%-d')"
        MSYS2_ARG_CONV_EXCL='*' bash packaging/bootstrapper/build_setup.sh \
          dist/Ephemeral-Distributed-Instructor \
          dist/podman-installer-windows-amd64.msi \
          dist/Ephemeral-Distributed-Instructor.msi \
          dist/Ephemeral-Distributed-Instructor-Setup.exe \
          "$VERSION"

    - name: Smoke test - the bundle carries and unpacks every prerequisite
      shell: bash
      run: |
        # `-layout` is Burn's own extraction: it verifies the bundle's payload
        # table and writes the packages it would install, WITH no install, no
        # elevation and no reboot. That is the only honest check a CI runner
        # can make of a bundle whose chain installs a Windows feature.
        export MSYS2_ARG_CONV_EXCL='*'
        SETUP="$PWD/dist/Ephemeral-Distributed-Instructor-Setup.exe"
        if [ ! -f "$SETUP" ]; then
          echo "no setup bundle at $SETUP" >&2
          exit 1
        fi
        magic="$(head -c 2 "$SETUP" | od -An -tx1 | tr -d ' \n')"
        if [ "$magic" != "4d5a" ]; then
          echo "the setup bundle is not a PE executable (magic: $magic)" >&2
          exit 1
        fi
        echo "bundle: $(du -h "$SETUP" | cut -f1)"
        rm -rf dist/setup-layout
        "$SETUP" -layout "$(cygpath -w "$PWD/dist/setup-layout")" -quiet || {
          echo "the bundle could not lay out its payloads" >&2
          exit 1
        }
        ls -la dist/setup-layout
        # All three packages must be present: the app, Podman, and the exe that
        # enables WSL2 (the same file as the app, installed as a prerequisite).
        exists=0
        for want in Ephemeral-Distributed-Instructor.msi podman-installer-windows-amd64.msi; do
          find dist/setup-layout -iname "$want" | grep -q . || {
            echo "the bundle is missing its prerequisite payload: $want" >&2
            exit 1
          }
          exists=$((exists + 1))
        done
        find dist/setup-layout -iname "Ephemeral-Distributed-Instructor.exe" | grep -q . || {
          echo "the bundle is missing the exe that enables WSL2" >&2
          exit 1
        }
        echo "setup bundle unpacks $exists prerequisite package(s) plus the app"

    - name: Smoke test - the prerequisite entry point answers
      shell: bash
      run: |
        # The bundle's first package is the app with --setup-prereqs. Runners do
        # not have WSL2 enabled, so the answer here is expected to be a failure
        # code: what is being checked is that the flag is wired and it reports a
        # state instead of starting a tray. 0 (ready) and 1 (missing) are both
        # honest answers; a traceback or a hang is not.
        #
        # The shipped exe is windowed (PyInstaller console=False), so stdout is
        # None there and print() is a silent no-op: assert on the log that
        # prereq.say() writes, never on stdout. EPHEMERAL_STATE_DIR also keeps
        # this throwaway check out of the runner's real ~/.ephemeral.
        export MSYS2_ARG_CONV_EXCL='*'
        STATE="$(cygpath -w "$PWD/dist/setup-check-state")"
        mkdir -p dist/setup-check-state
        cd dist/Ephemeral-Distributed-Instructor
        code=0
        EPHEMERAL_STATE_DIR="$STATE" ./Ephemeral-Distributed-Instructor.exe --setup-prereqs --check || code=$?
        echo "--setup-prereqs --check exited $code"
        case "$code" in
          0|1) ;;
          *) echo "--check exited $code, which is neither ready nor missing" >&2; exit 1 ;;
        esac
        LOG="$PWD/../../dist/setup-check-state/setup.log"
        if [ ! -f "$LOG" ]; then
          echo "--check wrote no setup.log: the windowed build has no stdout, so "
          echo "the log is the only record of what it decided" >&2
          exit 1
        fi
        cat "$LOG"
        grep -q '\[setup\] check:' "$LOG" || {
          echo "setup.log carries no state line" >&2
          exit 1
        }
        # A state the tray can act on has to be named, not just numbered.
        grep -Eq 'check: (ready|no-wsl|needs-reboot|no-virtualization|no-podman|no-machine|machine-stopped)' "$LOG" || {
          echo "setup.log named no recognisable runtime state" >&2
          exit 1
        }

    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-Distributed-Instructor-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'pyinstaller --noconfirm packaging/ephemeral-distributed-instructor.spec' \
          --artifact dist/Ephemeral-Distributed-Instructor-win64.zip \
          --artifact dist/Ephemeral-Distributed-Instructor.msi \
          --artifact dist/Ephemeral-Distributed-Instructor-Setup.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Distributed-Instructor-Windows-onedir
        path: |
          dist/Ephemeral-Distributed-Instructor-win64.zip
          dist/Ephemeral-Distributed-Instructor.msi
          dist/Ephemeral-Distributed-Instructor-Setup.exe
          dist/Ephemeral-Distributed-Instructor-build-manifest.json

  # ── Linux AppImages: local + distributed ──────────────────────
  build-linux-appimage:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build local AppImage
      shell: bash
      run: |
        VERSION="$(date +'%Y%m%d')-${GITHUB_SHA::7}" bash packaging/build_appimage.sh local

    - name: Build distributed AppImage
      shell: bash
      run: |
        VERSION="$(date +'%Y%m%d')-${GITHUB_SHA::7}" bash packaging/build_appimage.sh distributed

    - name: Smoke test — local AppImage self-check
      shell: bash
      run: |
        chmod +x dist/ephemeral-local-x86_64.AppImage
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ephemeral-local-x86_64.AppImage --self-check

    - name: Smoke test — distributed AppImage self-check
      shell: bash
      run: |
        chmod +x dist/ephemeral-distributed-x86_64.AppImage
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ephemeral-distributed-x86_64.AppImage --self-check

    # Release consistency: a release's wasm tarball must match the exact
    # released source, not whatever glue was last committed (wasm-build.yml
    # commits glue to main on a separate bot commit, so the committed web/wbg
    # can lag the source). On release runs, compile the wasm here and let the
    # packaging step below tar the freshly generated glue. Ordinary pushes
    # keep packaging the committed glue — no duplicate compile per commit.
    - name: Set up Rust (wasm target, release only)
      if: github.event.inputs.create_release == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Build wasm module (release only)
      if: github.event.inputs.create_release == 'true'
      shell: bash
      working-directory: ephemeral-wasm-library
      env:
        CC_wasm32_unknown_unknown: clang
        AR_wasm32_unknown_unknown: llvm-ar
      run: |
        # The runner ships clang but not llvm-ar; ring's build needs the LLVM
        # archiver to produce the wasm static lib from clang's objects.
        sudo apt-get update
        sudo apt-get install -y llvm
        command -v clang
        command -v llvm-ar
        curl -fsSL \
          https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz \
          | tar xz
        export PATH="$(pwd)/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl:$PATH"
        cargo build --release --target wasm32-unknown-unknown
        wasm-bindgen --target web --out-dir web/wbg \
          target/wasm32-unknown-unknown/release/ephemeral_wasm_library.wasm

    - name: Package wasm/SPA bundle
      shell: bash
      run: |
        cd ephemeral-wasm-library
        tar czf ../dist/ephemeral-wasm-library.tar.gz web/ src/ Cargo.toml build.sh README.md .cargo/
        cd ..

    - name: Package self-host distributed tier
      shell: bash
      run: |
        # main_distributed.py imports the shared API wire contract, which pulls
        # in ephemeral_core; the gateway pulls in ephemeral_net. MCP source is
        # included for explicit private server builds.
        tar czf dist/ephemeral-self-host-distributed.tar.gz \
          ephemeral_self_host/ ephemeral_net/ main_distributed.py \
          ephemeral_api/ ephemeral_core/ ephemeral_mcp/ requirements-net.txt requirements-api.txt requirements-mcp.txt \
          Dockerfile .dockerignore

    - name: Package self-host (non-distributed) tier
      shell: bash
      run: |
        tar czf dist/ephemeral-self-host.tar.gz \
          main_api.py          ephemeral_api/ ephemeral_core/ ephemeral_mcp/ \
          requirements-api.txt requirements-mcp.txt Dockerfile.api .dockerignore


    - name: Generate build manifest
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        VERSION="$(date +'%Y%m%d')-${SHORT_SHA}"
        python packaging/write_build_manifest.py \
          --output dist/Ephemeral-Linux-build-manifest.json \
          --build-version "$VERSION" \
          --build-command 'packaging/build_appimage.sh local && packaging/build_appimage.sh distributed' \
          --artifact dist/ephemeral-local-x86_64.AppImage \
          --artifact dist/ephemeral-distributed-x86_64.AppImage \
          --artifact dist/ephemeral-wasm-library.tar.gz \
          --artifact dist/ephemeral-self-host-distributed.tar.gz \
          --artifact dist/ephemeral-self-host.tar.gz

    - name: Smoke test — install script + release tarballs
      shell: bash
      run: |
        set -euo pipefail
        # EPHEMERAL_FROM_MAIN=1 makes the installer test deterministic against
        # the current branch (the released tarball is only rebuilt on release).
        export INSTALL_DIR="$HOME/.ephemeral-smoke-local"
        curl -fsSL https://raw.githubusercontent.com/Xyvir/Ephemeral.exe/main/install_self_host.sh | EPHEMERAL_FROM_MAIN=1 EPHEMERAL_PREHYDRATE=0 bash -s -- local
        (cd "$INSTALL_DIR" && .venv/bin/python -c "from main_api import app; print('local API imports OK')")
        export INSTALL_DIR="$HOME/.ephemeral-smoke-dist"
        curl -fsSL https://raw.githubusercontent.com/Xyvir/Ephemeral.exe/main/install_self_host.sh | EPHEMERAL_FROM_MAIN=1 EPHEMERAL_PREHYDRATE=0 bash -s -- distributed
        (cd "$INSTALL_DIR" && .venv/bin/python -c "from main_distributed import app; print('distributed gateway imports OK')")
        # Verify the tarballs that releases/installer users actually receive are
        # complete (main_distributed imports main_api -> ephemeral_core, and the
        # gateway pulls in ephemeral_net).
        PY="$INSTALL_DIR/.venv/bin/python"
        rm -rf "$HOME/.tarball-check" && mkdir -p "$HOME/.tarball-check"
        tar -xzf "dist/ephemeral-self-host.tar.gz" -C "$HOME/.tarball-check"
        (cd "$HOME/.tarball-check" && "$PY" -c "import main_api")
        rm -rf "$HOME/.tarball-check" && mkdir -p "$HOME/.tarball-check"
        tar -xzf "dist/ephemeral-self-host-distributed.tar.gz" -C "$HOME/.tarball-check"
        (cd "$HOME/.tarball-check" && "$PY" -c "import main_distributed; print('both tarballs import OK')")

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Ephemeral-Linux-AppImages
        path: |
          dist/ephemeral-local-x86_64.AppImage
          dist/ephemeral-distributed-x86_64.AppImage
          dist/ephemeral-wasm-library.tar.gz
          dist/ephemeral-self-host-distributed.tar.gz
          dist/ephemeral-self-host.tar.gz

  # ── ClamAV canary: best effort, never blocks ──────────────────
  # A single-engine smoke signal over the built Windows executables — the
  # artifacts antivirus actually flags. ClamAV cannot reproduce Windows
  # Defender's PyInstaller heuristics, so this job reports and always passes:
  # it exists to catch an obviously bad artifact and to leave a per-build
  # record, never to be a verdict (see scripts/scan_artifacts.sh). It is
  # deliberately NOT in the release job's `needs`, so it cannot gate a release.
  scan-artifacts:
    runs-on: ubuntu-latest
    needs: [build-exe, build-exe-distributed, build-exe-distributed-instructor]

    steps:
    - uses: actions/checkout@v4

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        merge-multiple: true

    - name: Install ClamAV
      continue-on-error: true
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clamav
        # freshclam holds the database lock while its service runs; stop it,
        # then fall back to the packaged database if the update fails — a
        # stale database still beats no canary.
        sudo systemctl stop clamav-freshclam 2>/dev/null || true
        sudo freshclam || echo "::warning::ClamAV signature update failed; scanning with the packaged database"

    - name: Scan artifacts (soft gate - never blocks a release)
      continue-on-error: true
      run: bash scripts/scan_artifacts.sh artifacts

    - name: Upload ClamAV report
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ClamAV-report
        path: clamav-report.txt
        if-no-files-found: ignore

  # ── Release ───────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-exe, build-exe-distributed, build-exe-distributed-instructor, build-linux-appimage]
    if: github.event.inputs.create_release == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: Generate tag
      id: tag
      shell: bash
      run: |
        FULL_SHA="${{ github.sha }}"
        SHORT_SHA="${FULL_SHA:0:7}"
        echo "TAG=v$(date +'%Y%m%d-%H%M%S')-${SHORT_SHA}" >> $GITHUB_ENV

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: Release ${{ env.TAG }}
        files: |
          dist/Ephemeral-Distributed-Instructor-win64.zip
          dist/Ephemeral-Distributed-Instructor.msi
          dist/Ephemeral-Distributed-Instructor-Setup.exe
          dist/Ephemeral.exe
          dist/Ephemeral-Distributed.exe
          dist/ephemeral-local-x86_64.AppImage
          dist/ephemeral-distributed-x86_64.AppImage
          dist/ephemeral-wasm-library.tar.gz
          dist/ephemeral-self-host-distributed.tar.gz
          dist/ephemeral-self-host.tar.gz
          dist/Ephemeral-build-manifest.json
          dist/Ephemeral-Distributed-build-manifest.json
          dist/Ephemeral-Distributed-Instructor-build-manifest.json
          dist/Ephemeral-Linux-build-manifest.json
        generate_release_notes: true
