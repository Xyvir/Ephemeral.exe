name: Refresh Swarm Bootstrap List

# Keeps docs/swarm.json fresh so thin/first-time joiners (the wasm SPA,
# paper-thin REST clients, other nodes) always have a current list of
# live swarm members to dial — no always-on discovery box required.
#
# The refresh also sends every reachable node a real job (a python
# print(<nonce>) probe) and records who verified — see
# ephemeral_net/probe.py — so the list reflects actual live compute
# nodes, not just nodes that answer the hello handshake.
#
# The bot's own commit (docs/swarm.json) is excluded from the main
# Build & Release pipeline via paths-ignore, so it never spawns full
# artifact builds.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      reset:
        description: "Forget every entry and regenerate the list fresh from the genesis anchor"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install networking tier deps
      run: pip install -r requirements-net.txt

    # The genesis anchor is config, not code: set the SWARM_GENESIS repo
    # variable (Settings -> Secrets and variables -> Actions -> Variables,
    # comma-separated node_id@relay) to point at your own always-on node.
    # Unset, the script uses its built-in default. This only matters for
    # the very first, empty list — afterwards the list regenerates from
    # its own members.
    #
    # DNS TXT redundancy (optional): set EPHEMERAL_DNS_TXT (variable, the
    # TXT record hostname) and EPHEMERAL_DNS_TOKEN (secret, a Cloudflare
    # API token with DNS edit) to also keep a `iroh1:<node_id>;<relay>`
    # TXT record pointing at the current anchor — an independent, tiered
    # path to the swarm when GitHub is unreachable. EPHEMERAL_DNS_ZONE
    # (variable) is optional; the zone is auto-detected when unset.
    - name: Discover the live swarm
      env:
        SWARM_GENESIS: ${{ vars.SWARM_GENESIS }}
        EPHEMERAL_DNS_TXT: ${{ vars.EPHEMERAL_DNS_TXT }}
        EPHEMERAL_DNS_ZONE: ${{ vars.EPHEMERAL_DNS_ZONE }}
        EPHEMERAL_DNS_TOKEN: ${{ secrets.EPHEMERAL_DNS_TOKEN }}
      # Manual runs can check "reset" to forget the previous list and
      # regenerate a fresh census from the genesis anchor (scheduled runs
      # and un-checked manual runs keep the incremental merge).
      run: python scripts/update_swarm_json.py ${{ github.event.inputs.reset == 'true' && '--reset' || '' }}

    - name: Commit and push the refreshed list
      shell: bash
      run: |
        git config user.name "ephemeral-swarm-bot"
        git config user.email "actions@github.com"
        git add docs/swarm.json
        if git diff --cached --quiet; then
          echo "swarm.json unchanged — nothing to commit"
        else
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            git commit -m "swarm: reset and regenerate bootstrap list (manual)"
          else
            git commit -m "swarm: refresh bootstrap list (scheduled)"
          fi
          git pull --rebase --autostash origin main
          git push origin main
        fi
