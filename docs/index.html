<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="refresh" content="0; url=../ephemeral-wasm-library/web/" />
<title>Ephemeral Web — redirecting…</title>
<script>
  // Same redirect as the meta refresh, but via history.replace so the SPA
  // lands in the address bar instead of a redirect hop.
  // Preserve any #seed=/#relay= fragment so a private-swarm link works
  // from /docs/ as well as the SPA's own path.
  location.replace("../ephemeral-wasm-library/web/" + location.hash);
</script>
</head>
<body>
  <p>Redirecting to the <a href="../ephemeral-wasm-library/web/">Ephemeral Web demo</a>…</p>
</body>
</html>
